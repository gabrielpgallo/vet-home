name: vet-domicilio
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vet_owner
      POSTGRES_DB: vet_domicilio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55435:5432"
    volumes:
      - vet-domicilio-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vet_owner -d vet_domicilio"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  vet-domicilio-data:
